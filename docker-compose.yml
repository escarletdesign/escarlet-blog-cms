services:
  cms:
    build: .
    ports:
      - '3040:3040'
    env_file:
      - .env
    environment:
      PORT: 3040
      CMS_PUBLIC_URL: http://localhost:3040
    volumes:
      - cms_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3040/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # Opcional. Postgres para futura migración a Payload 3
  postgres:
    profiles:
      - payload
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: escarlet_blog
    ports:
      - '5432:5432'
    volumes:
      - payload_pg:/var/lib/postgresql/data

volumes:
  cms_data:
    name: escarlet_blog_cms_data
  payload_pg:
