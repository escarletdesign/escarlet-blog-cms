<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1500" viewBox="0 0 1920 1500">
  <title>Escarlet · tablero visual CMS</title>
  <desc>Resumen editable de identidad, paleta y referencias visuales de Escarlet.</desc>
  <rect width="1920" height="1500" fill="#F3E7D0"/>
  <rect x="0" y="0" width="1920" height="250" fill="#1E1E1E"/>
  <image href="assets/logo-official-white.svg" x="96" y="72" width="360" height="84" preserveAspectRatio="xMidYMid meet"/>
  <text x="96" y="205" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Tu experiencia, en marcha.</text>
  <text x="96" y="330" fill="#1E1E1E" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">PALETA CANÓNICA DEL CMS 2.2.0</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#1E1E1E">
    <rect x="96" y="380" width="210" height="110" rx="18" fill="#F3E7D0" stroke="#1E1E1E" stroke-width="2"/><text x="116" y="530">Crema #F3E7D0</text>
    <rect x="346" y="380" width="210" height="110" rx="18" fill="#12B8D6"/><text x="366" y="530">Cian #12B8D6</text>
    <rect x="596" y="380" width="210" height="110" rx="18" fill="#62B38A"/><text x="616" y="530">Verde #62B38A</text>
    <rect x="846" y="380" width="210" height="110" rx="18" fill="#1E1E1E"/><text x="866" y="530">Carbón #1E1E1E</text>
    <rect x="1096" y="380" width="210" height="110" rx="18" fill="#E8B73A"/><text x="1116" y="530">Oro #E8B73A</text>
    <rect x="1346" y="380" width="210" height="110" rx="18" fill="#6D6D6D"/><text x="1366" y="530">Gris #6D6D6D</text>
  </g>
  <text x="96" y="620" fill="#1E1E1E" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">REFERENCIAS CANÓNICAS</text>
  <image href="assets/reference-blog-example.png" x="96" y="670" width="420" height="236" preserveAspectRatio="xMidYMid slice"/>
  <image href="assets/reference-visual-style-01.png" x="540" y="670" width="280" height="396" preserveAspectRatio="xMidYMid slice"/>
  <image href="assets/reference-visual-style-02.png" x="850" y="670" width="280" height="396" preserveAspectRatio="xMidYMid slice"/>
  <image href="assets/reference-visual-style-03.png" x="1160" y="670" width="396" height="264" preserveAspectRatio="xMidYMid slice"/>
  <rect x="96" y="1130" width="1460" height="2" fill="#E8B73A"/>
  <text x="96" y="1200" fill="#12B8D6" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">CUATRO PALABRAS NÚCLEO</text>
  <text x="96" y="1280" fill="#1E1E1E" font-family="Inter, Arial, sans-serif" font-size="40">experiencia · claridad · proceso · puesta en marcha</text>
  <text x="96" y="1380" fill="#6D6D6D" font-family="Inter, Arial, sans-serif" font-size="22">El MCP usa rutas deterministas y entrega las referencias exactas de la versión 2.2.0.</text>
