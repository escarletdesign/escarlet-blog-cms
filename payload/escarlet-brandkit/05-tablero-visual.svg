<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1500" viewBox="0 0 1920 1500">
  <title>Escarlet · tablero visual CMS</title>
  <desc>Resumen editable de identidad, paleta y referencias visuales de Escarlet.</desc>
  <rect width="1920" height="1500" fill="#F4F1EA"/>
  <rect x="0" y="0" width="1920" height="250" fill="#15352A"/>
  <image href="assets/logo-official-white.svg" x="96" y="72" width="360" height="84" preserveAspectRatio="xMidYMid meet"/>
  <text x="96" y="205" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Tu experiencia, en marcha.</text>
  <text x="96" y="330" fill="#1B211D" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">PALETA OPERATIVA DEL CMS</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#1B211D">
    <rect x="96" y="380" width="210" height="110" rx="18" fill="#F4F1EA" stroke="#1B211D" stroke-width="2"/><text x="116" y="530">Papel #F4F1EA</text>
    <rect x="346" y="380" width="210" height="110" rx="18" fill="#1F4D3A"/><text x="366" y="530">Bosque #1F4D3A</text>
    <rect x="596" y="380" width="210" height="110" rx="18" fill="#15352A"/><text x="616" y="530">Profundo #15352A</text>
    <rect x="846" y="380" width="210" height="110" rx="18" fill="#1B211D"/><text x="866" y="530">Tinta #1B211D</text>
    <rect x="1096" y="380" width="210" height="110" rx="18" fill="#C8674B"/><text x="1116" y="530">Señal #C8674B</text>
    <rect x="1346" y="380" width="210" height="110" rx="18" fill="#6C746F"/><text x="1366" y="530">Gris #6C746F</text>
  </g>
  <text x="96" y="620" fill="#1B211D" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">REFERENCIAS APORTADAS</text>
  <image href="assets/reference-blog-example.png" x="96" y="670" width="420" height="236" preserveAspectRatio="xMidYMid slice"/>
  <image href="assets/reference-visual-style-01.png" x="540" y="670" width="280" height="396" preserveAspectRatio="xMidYMid slice"/>
  <image href="assets/reference-visual-style-02.png" x="850" y="670" width="280" height="396" preserveAspectRatio="xMidYMid slice"/>
  <image href="assets/reference-visual-style-03.png" x="1160" y="670" width="396" height="264" preserveAspectRatio="xMidYMid slice"/>
  <rect x="96" y="1130" width="1460" height="2" fill="#C8674B"/>
  <text x="96" y="1200" fill="#1F4D3A" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">CUATRO PALABRAS NÚCLEO</text>
  <text x="96" y="1280" fill="#1B211D" font-family="Inter, Arial, sans-serif" font-size="40">experiencia · claridad · proceso · puesta en marcha</text>
  <text x="96" y="1380" fill="#6C746F" font-family="Inter, Arial, sans-serif" font-size="22">Las imágenes cian–verde–oro son referencia editorial de cabecera. El runtime usa la paleta v2 documentada arriba.</text>
</svg>
